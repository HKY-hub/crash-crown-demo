<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">战斗系统分层与判定职责</title><desc id="desc">物理冲量、耐久伤害和稳定损失分开处理；模式覆盖保留真实接触。</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#536b70"/></marker><marker id="proposal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a15b16"/></marker></defs><style>text{font-family:Microsoft YaHei, Noto Sans CJK SC, sans-serif;fill:#1d3035} .secondary{fill:#526569} .label{font-size:22px;font-weight:600} .edge{fill:none;stroke:#536b70;stroke-width:3;marker-end:url(#arrow)} .proposed{stroke:#a15b16;stroke-dasharray:10 7;marker-end:url(#proposal)} .box{fill:#fffefa;stroke:#728b8c;stroke-width:2} .proposal-box{fill:#fff4df;stroke:#ad6b29;stroke-width:2.3;stroke-dasharray:10 7} .row{fill:#e9eee9} .panel{fill:#f7f5eb;stroke:#c7d0c8;stroke-width:1.5}</style><rect width="1920" height="1080" fill="#f5f3e9"/><rect width="1920" height="124" fill="#18373f"/><text x="54" y="65" style="fill:#fff9e9;font-size:43px;font-weight:700">02  战斗系统分层与判定职责</text><text x="56" y="104" style="fill:#d4e2dc;font-size:22px">物理冲量、耐久伤害和稳定损失分开处理；模式覆盖保留真实接触。</text><path d="M55 1017H1865" stroke="#c2ccc3" stroke-width="2"/><text x="56" y="1054" font-size="21" class="secondary">03:34研究基线 8ce571…｜规则关系依据正式版本：R03—R12、R15、R16、R24—R26｜箭头不宣称统一事件总线已经实现。</text><rect x="42" y="154" width="410" height="690" rx="12" class="panel"/><text x="64" y="188" font-size="23" font-weight="700" style="fill:#586c65">请求与条件</text><g class="architecture-node" data-x="64" data-y="217" data-width="366" data-height="155"><rect x="64" y="217" width="366" height="155" rx="9" class="box"/><text x="84" y="256" font-size="29" font-weight="700">输入与有效属性</text><text x="84" y="293" font-size="22" style="fill:#526569">玩家／AI驾驶意图</text><text x="84" y="323" font-size="22" style="fill:#526569">车型、构筑、临时状态</text><text x="84" y="353" font-size="22" style="fill:#526569">冲势、技能可用性</text></g><g class="architecture-node" data-x="64" data-y="420" data-width="366" data-height="155"><rect x="64" y="420" width="366" height="155" rx="9" class="box"/><text x="84" y="459" font-size="29" font-weight="700">地图与机关</text><text x="84" y="496" font-size="22" style="fill:#526569">支撑、边缘、动态平台</text><text x="84" y="526" font-size="22" style="fill:#526569">区域效果与资源刷新</text><text x="84" y="556" font-size="22" style="fill:#526569">模式允许的地图规则</text></g><g class="architecture-node" data-x="64" data-y="623" data-width="366" data-height="155"><rect x="64" y="623" width="366" height="155" rx="9" class="box"/><text x="84" y="662" font-size="29" font-weight="700">技能与道具请求</text><text x="84" y="699" font-size="22" style="fill:#526569">目标、距离、敌我、冷却</text><text x="84" y="729" font-size="22" style="fill:#526569">护盾、无敌、领域、弹体</text><text x="84" y="759" font-size="22" style="fill:#526569">不是直接修改表现数值</text></g><rect x="490" y="154" width="455" height="690" rx="12" class="panel"/><text x="512" y="188" font-size="23" font-weight="700" style="fill:#586c65">运动与攻击依据</text><g class="architecture-node" data-x="515" data-y="217" data-width="405" data-height="210"><rect x="515" y="217" width="405" height="210" rx="9" class="box"/><rect x="515" y="217" width="7" height="210" rx="2" fill="#cb6925"/><text x="535" y="256" font-size="28" font-weight="700">物理世界｜120Hz</text><text x="535" y="293" font-size="22" style="fill:#526569">Rapier统一积分与碰撞</text><text x="535" y="323" font-size="22" style="fill:#526569">发布位姿、接触法线和冲量</text><text x="535" y="353" font-size="22" style="fill:#526569">移动、推移、滚动、支撑</text><text x="535" y="383" font-size="22" style="fill:#526569">实体接触独立于是否计伤</text></g><g class="architecture-node" data-x="515" data-y="513" data-width="405" data-height="237"><rect x="515" y="513" width="405" height="237" rx="9" class="box"/><text x="535" y="552" font-size="28" font-weight="700">接触／技能规则</text><text x="535" y="589" font-size="22" style="fill:#526569">接触贡献、方向、速度与窗口</text><text x="535" y="619" font-size="22" style="fill:#526569">区分物理接触和技能来源</text><text x="535" y="649" font-size="22" style="fill:#526569">模式前置过滤 impact_pre_settle</text><text x="535" y="679" font-size="22" style="fill:#526569">输出允许的玩法损失与状态</text><text x="535" y="709" font-size="22" style="fill:#526569">表现火花／凹陷不二次扣血</text></g><rect x="983" y="154" width="455" height="690" rx="12" class="panel"/><text x="1005" y="188" font-size="23" font-weight="700" style="fill:#586c65">车体状态与生存资格</text><g class="architecture-node" data-x="1008" data-y="217" data-width="405" data-height="155"><rect x="1008" y="217" width="405" height="155" rx="9" class="box"/><text x="1028" y="256" font-size="28" font-weight="700">控制与保护检查</text><text x="1028" y="293" font-size="22" style="fill:#526569">敌我、护甲、无敌、技能控制</text><text x="1028" y="323" font-size="22" style="fill:#526569">确认适用减免、恢复与打断</text><text x="1028" y="353" font-size="22" style="fill:#526569">接受或取消本次玩法修改</text></g><g class="architecture-node" data-x="1008" data-y="440" data-width="405" data-height="155"><rect x="1008" y="440" width="405" height="155" rx="9" class="box"/><rect x="1008" y="440" width="7" height="155" rx="2" fill="#cb6925"/><text x="1028" y="479" font-size="28" font-weight="700">耐久、稳定、冲势</text><text x="1028" y="516" font-size="22" style="fill:#526569">耐久：结构生命与撞毁</text><text x="1028" y="546" font-size="22" style="fill:#526569">稳定：受击后的操控能力</text><text x="1028" y="576" font-size="22" style="fill:#526569">冲势：分段加速的资源</text></g><g class="architecture-node" data-x="1008" data-y="662" data-width="405" data-height="138"><rect x="1008" y="662" width="405" height="138" rx="9" class="box"/><text x="1028" y="701" font-size="28" font-weight="700">淘汰／返场资格</text><text x="1028" y="738" font-size="22" style="fill:#526569">先裁定复活或模式返场</text><text x="1028" y="768" font-size="22" style="fill:#526569">再确认死亡、坠落和归因</text></g><rect x="1476" y="154" width="402" height="690" rx="12" class="panel"/><text x="1498" y="188" font-size="23" font-weight="700" style="fill:#586c65">模式、显示与结果</text><g class="architecture-node" data-x="1497" data-y="217" data-width="360" data-height="165"><rect x="1497" y="217" width="360" height="165" rx="9" class="box"/><text x="1517" y="256" font-size="27" font-weight="700">模式裁决</text><text x="1517" y="293" font-size="22" style="fill:#526569">经典最后存活；BR队伍存活</text><text x="1517" y="323" font-size="22" style="fill:#526569">团队团灭、回合比分</text><text x="1517" y="353" font-size="22" style="fill:#526569">训练／关卡各自目标</text></g><g class="architecture-node" data-x="1497" data-y="453" data-width="360" data-height="137"><rect x="1497" y="453" width="360" height="137" rx="9" class="box"/><text x="1517" y="492" font-size="27" font-weight="700">HUD与反馈</text><text x="1517" y="529" font-size="22" style="fill:#526569">读取确认状态与归因</text><text x="1517" y="559" font-size="22" style="fill:#526569">不因动画或音效再次计伤</text></g><g class="architecture-node" data-x="1497" data-y="661" data-width="360" data-height="139"><rect x="1497" y="661" width="360" height="139" rx="9" class="box"/><text x="1517" y="700" font-size="27" font-weight="700">结束与奖励入口</text><text x="1517" y="737" font-size="22" style="fill:#526569">先确认回合／整场结果</text><text x="1517" y="767" font-size="22" style="fill:#526569">再交生涯与经济处理</text></g><path d="M430,292 L515,292" class="edge"/><path d="M430,495 L472,495 L472,365 L515,365" class="edge"/><path d="M430,700 L515,700" class="edge"/><path d="M716,427 L716,513" class="edge"/><text x="729" y="479" font-size="21" font-weight="600" style="fill:#536b70">接触事实</text><path d="M920,575 L962,575 L962,292 L1008,292" class="edge"/><path d="M1211,372 L1211,440" class="edge"/><path d="M1211,595 L1211,662" class="edge"/><path d="M1413,731 L1455,731 L1455,300 L1497,300" class="edge"/><path d="M1413,514 L1497,514" class="edge"/><path d="M1677,382 L1677,453" class="edge"/><path d="M1857,300 L1870,300 L1870,731 L1857,731" class="edge"/><g class="architecture-node" data-x="64" data-y="881" data-width="856" data-height="102"><rect x="64" y="881" width="856" height="102" rx="9" class="box"/><text x="84" y="920" font-size="27" font-weight="700">关键模式覆盖</text><text x="84" y="957" font-size="22" style="fill:#526569">撞飞：专用燃料与真实空中返场；失衡：实体碰撞免耐久和稳定伤害。</text></g><g class="architecture-node" data-x="1008" data-y="881" data-width="849" data-height="102"><rect x="1008" y="881" width="849" height="102" rx="9" class="box"/><text x="1028" y="920" font-size="27" font-weight="700">关键责任边界</text><text x="1028" y="957" font-size="22" style="fill:#526569">保护状态可以取消玩法损失；真实接触、推移和坠落仍需按模式处理。</text></g></svg>