<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">产品功能全景</title><desc id="desc">按玩家决策和结果归属分层；这是现行功能关系图，不是程序包／类依赖图。</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#536b70"/></marker><marker id="proposal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a15b16"/></marker></defs><style>text{font-family:Microsoft YaHei, Noto Sans CJK SC, sans-serif;fill:#1d3035} .secondary{fill:#526569} .label{font-size:22px;font-weight:600} .edge{fill:none;stroke:#536b70;stroke-width:3;marker-end:url(#arrow)} .proposed{stroke:#a15b16;stroke-dasharray:10 7;marker-end:url(#proposal)} .box{fill:#fffefa;stroke:#728b8c;stroke-width:2} .proposal-box{fill:#fff4df;stroke:#ad6b29;stroke-width:2.3;stroke-dasharray:10 7} .row{fill:#e9eee9} .panel{fill:#f7f5eb;stroke:#c7d0c8;stroke-width:1.5}</style><rect width="1920" height="1080" fill="#f5f3e9"/><rect width="1920" height="124" fill="#18373f"/><text x="54" y="65" style="fill:#fff9e9;font-size:43px;font-weight:700">01  产品功能全景</text><text x="56" y="104" style="fill:#d4e2dc;font-size:22px">按玩家决策和结果归属分层；这是现行功能关系图，不是程序包／类依赖图。</text><path d="M55 1017H1865" stroke="#c2ccc3" stroke-width="2"/><text x="56" y="1054" font-size="21" class="secondary">03:34研究基线 8ce571…｜版本截点：2026-10-14 03:34｜实线表示功能依赖与结果传递；内容目录不等于账号已拥有。</text><rect x="45" y="151" width="1830" height="220" rx="12" class="panel"/><text x="67" y="185" font-size="23" font-weight="700" style="fill:#586c65">赛前条件｜先确认本场允许什么，再决定怎样打</text><g class="architecture-node" data-x="70" data-y="207" data-width="540" data-height="137"><rect x="70" y="207" width="540" height="137" rx="9" class="box"/><text x="90" y="246" font-size="30" font-weight="700">车辆与构筑</text><text x="90" y="283" font-size="22" style="fill:#526569">56辆目录：普通18／稀有18／泰坦20</text><text x="90" y="313" font-size="22" style="fill:#526569">原型、主动／被动、模块、天赋、主题皮肤</text></g><g class="architecture-node" data-x="690" data-y="207" data-width="540" data-height="137"><rect x="690" y="207" width="540" height="137" rx="9" class="box"/><text x="710" y="246" font-size="30" font-weight="700">模式与场地</text><text x="710" y="283" font-size="22" style="fill:#526569">经典、训练、挑战、试炼、章回</text><text x="710" y="313" font-size="22" style="fill:#526569">大逃杀、撞飞、失衡、军团；地图兼容</text></g><g class="architecture-node" data-x="1310" data-y="207" data-width="540" data-height="137"><rect x="1310" y="207" width="540" height="137" rx="9" class="box"/><text x="1330" y="246" font-size="30" font-weight="700">账号与使用许可</text><text x="1330" y="283" font-size="22" style="fill:#526569">可查看、可出战、可装备分别检查</text><text x="1330" y="313" font-size="22" style="fill:#526569">普通车开放；稀有／泰坦核对整车权益</text></g><path d="M340,344 L340,420" class="edge"/><path d="M960,344 L960,420" class="edge"/><path d="M1580,344 L1580,420" class="edge"/><rect x="45" y="400" width="1830" height="285" rx="12" class="panel"/><text x="67" y="434" font-size="23" font-weight="700" style="fill:#586c65">局内执行｜车辆、技能和地形共同改变一次接触</text><g class="architecture-node" data-x="70" data-y="470" data-width="395" data-height="175"><rect x="70" y="470" width="395" height="175" rx="9" class="box"/><text x="90" y="509" font-size="30" font-weight="700">驾驶与资源</text><text x="90" y="546" font-size="22" style="fill:#526569">油门／刹车／转向</text><text x="90" y="576" font-size="22" style="fill:#526569">冲势分段与消耗恢复</text><text x="90" y="606" font-size="22" style="fill:#526569">输入、操控和有效属性</text></g><g class="architecture-node" data-x="505" data-y="470" data-width="435" data-height="175"><rect x="505" y="470" width="435" height="175" rx="9" class="box"/><text x="525" y="509" font-size="30" font-weight="700">物理与地图</text><text x="525" y="546" font-size="22" style="fill:#526569">Rapier：支撑、接触、冲量</text><text x="525" y="576" font-size="22" style="fill:#526569">机关、地形、坠落与空中返场</text><text x="525" y="606" font-size="22" style="fill:#526569">物理位姿由统一世界发布</text></g><g class="architecture-node" data-x="980" data-y="470" data-width="435" data-height="175"><rect x="980" y="470" width="435" height="175" rx="9" class="box"/><text x="1000" y="509" font-size="30" font-weight="700">技能／道具／AI</text><text x="1000" y="546" font-size="22" style="fill:#526569">主动、被动、领域与弹体</text><text x="1000" y="576" font-size="22" style="fill:#526569">拾取、冷却、目标和敌我检查</text><text x="1000" y="606" font-size="22" style="fill:#526569">AI决策最终提交驾驶／动作</text></g><g class="architecture-node" data-x="1455" data-y="470" data-width="395" data-height="175"><rect x="1455" y="470" width="395" height="175" rx="9" class="box"/><text x="1475" y="509" font-size="30" font-weight="700">战斗与资格</text><text x="1475" y="546" font-size="22" style="fill:#526569">耐久／稳定／冲势</text><text x="1475" y="576" font-size="22" style="fill:#526569">控制状态、伤害与归因</text><text x="1475" y="606" font-size="22" style="fill:#526569">复活、淘汰或模式专用返场</text></g><path d="M465,550 L505,550" class="edge"/><path d="M940,550 L960,550 L960,678 L1435,678 L1435,558 L1455,558" class="edge"/><path d="M1415,570 L1455,570" class="edge"/><rect x="45" y="728" width="1830" height="233" rx="12" class="panel"/><text x="67" y="762" font-size="23" font-weight="700" style="fill:#586c65">结果与下一次选择｜模式判胜，结算确认后才写长期进度</text><g class="architecture-node" data-x="70" data-y="787" data-width="540" data-height="142"><rect x="70" y="787" width="540" height="142" rx="9" class="box"/><text x="90" y="826" font-size="30" font-weight="700">模式判定</text><text x="90" y="863" font-size="22" style="fill:#526569">存活、队伍、回合、进化或关卡目标</text><text x="90" y="893" font-size="22" style="fill:#526569">决定何时结束；训练与比赛收益分开</text></g><g class="architecture-node" data-x="690" data-y="787" data-width="540" data-height="142"><rect x="690" y="787" width="540" height="142" rx="9" class="box"/><text x="710" y="826" font-size="30" font-weight="700">结算与长期进度</text><text x="710" y="863" font-size="22" style="fill:#526569">生涯、目标任务、通行证有效进度</text><text x="710" y="893" font-size="22" style="fill:#526569">结果确认；奖励来源及重复处理</text></g><g class="architecture-node" data-x="1310" data-y="787" data-width="540" data-height="142"><rect x="1310" y="787" width="540" height="142" rx="9" class="box"/><text x="1330" y="826" font-size="30" font-weight="700">成长与永久资产</text><text x="1330" y="863" font-size="22" style="fill:#526569">局外模块／天赋与车辆使用选择</text><text x="1330" y="893" font-size="22" style="fill:#526569">整车、主题皮肤、碎片、芯片、奖券</text></g><path d="M1630,645 L1630,710 L640,710 L640,850 L610,850" class="edge"/><path d="M610,865 L690,865" class="edge"/><path d="M1230,865 L1310,865" class="edge"/><text x="72" y="996" font-size="23" font-weight="600">读图顺序：赛前许可 → 局内运动与状态 → 模式结果 → 长期进度 → 下一场配置。</text></svg>