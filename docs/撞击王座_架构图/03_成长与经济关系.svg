<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">局外成长与经济关系</title><desc id="desc">生涯资料与经济钱包分别保存；解锁、收藏、出战和装备是不同检查。</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#536b70"/></marker><marker id="proposal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a15b16"/></marker></defs><style>text{font-family:Microsoft YaHei, Noto Sans CJK SC, sans-serif;fill:#1d3035} .secondary{fill:#526569} .label{font-size:22px;font-weight:600} .edge{fill:none;stroke:#536b70;stroke-width:3;marker-end:url(#arrow)} .proposed{stroke:#a15b16;stroke-dasharray:10 7;marker-end:url(#proposal)} .box{fill:#fffefa;stroke:#728b8c;stroke-width:2} .proposal-box{fill:#fff4df;stroke:#ad6b29;stroke-width:2.3;stroke-dasharray:10 7} .row{fill:#e9eee9} .panel{fill:#f7f5eb;stroke:#c7d0c8;stroke-width:1.5}</style><rect width="1920" height="1080" fill="#f5f3e9"/><rect width="1920" height="124" fill="#18373f"/><text x="54" y="65" style="fill:#fff9e9;font-size:43px;font-weight:700">03  局外成长与经济关系</text><text x="56" y="104" style="fill:#d4e2dc;font-size:22px">生涯资料与经济钱包分别保存；解锁、收藏、出战和装备是不同检查。</text><path d="M55 1017H1865" stroke="#c2ccc3" stroke-width="2"/><text x="56" y="1054" font-size="21" class="secondary">03:34研究基线 8ce571…｜现行功能关系｜R17—R23、R28｜通行证按有效驾驶时间推进；训练不领取比赛胜利奖励。</text><rect x="42" y="154" width="400" height="623" rx="12" class="panel"/><text x="64" y="188" font-size="23" font-weight="700" style="fill:#586c65">玩家行为与来源</text><g class="architecture-node" data-x="65" data-y="217" data-width="354" data-height="140"><rect x="65" y="217" width="354" height="140" rx="9" class="box"/><text x="85" y="256" font-size="28" font-weight="700">对局与目标</text><text x="85" y="293" font-size="22" style="fill:#526569">已确认战果、任务进度</text><text x="85" y="323" font-size="22" style="fill:#526569">训练／比赛按各自资格计数</text></g><g class="architecture-node" data-x="65" data-y="418" data-width="354" data-height="140"><rect x="65" y="418" width="354" height="140" rx="9" class="box"/><text x="85" y="457" font-size="28" font-weight="700">有效驾驶时间</text><text x="85" y="494" font-size="22" style="fill:#526569">前台、有效输入和会话条件</text><text x="85" y="524" font-size="22" style="fill:#526569">推动通行证当周任务</text></g><g class="architecture-node" data-x="65" data-y="619" data-width="354" data-height="130"><rect x="65" y="619" width="354" height="130" rx="9" class="box"/><text x="85" y="658" font-size="28" font-weight="700">芯片与奖券</text><text x="85" y="695" font-size="22" style="fill:#526569">取得后可消费</text><text x="85" y="725" font-size="22" style="fill:#526569">当前为游戏内虚拟经济</text></g><rect x="490" y="154" width="558" height="623" rx="12" class="panel"/><text x="512" y="188" font-size="23" font-weight="700" style="fill:#586c65">规则处理与领取</text><g class="architecture-node" data-x="514" data-y="217" data-width="510" data-height="140"><rect x="514" y="217" width="510" height="140" rx="9" class="box"/><text x="534" y="256" font-size="29" font-weight="700">生涯、任务与成长</text><text x="534" y="293" font-size="22" style="fill:#526569">等级、金币、目标、模块及天赋</text><text x="534" y="323" font-size="22" style="fill:#526569">与经济钱包区分存档和消费者</text></g><g class="architecture-node" data-x="514" data-y="418" data-width="510" data-height="140"><rect x="514" y="418" width="510" height="140" rx="9" class="box"/><text x="534" y="457" font-size="29" font-weight="700">100级双轨通行证</text><text x="534" y="494" font-size="22" style="fill:#526569">28天、每级250 XP；周任务经验</text><text x="534" y="524" font-size="22" style="fill:#526569">38个皮肤节点；终奖整车；重复转换</text></g><g class="architecture-node" data-x="514" data-y="619" data-width="510" data-height="130"><rect x="514" y="619" width="510" height="130" rx="9" class="box"/><text x="534" y="658" font-size="29" font-weight="700">抽奖与商店</text><text x="534" y="695" font-size="22" style="fill:#526569">十类奖池、骑刃王60抽保底</text><text x="534" y="725" font-size="22" style="fill:#526569">类别内未拥有优先；重复奖励转换</text></g><rect x="1096" y="154" width="782" height="623" rx="12" class="panel"/><text x="1118" y="188" font-size="23" font-weight="700" style="fill:#586c65">进度与资产去向</text><g class="architecture-node" data-x="1120" data-y="217" data-width="734" data-height="140"><rect x="1120" y="217" width="734" height="140" rx="9" class="box"/><text x="1140" y="256" font-size="30" font-weight="700">本机生涯资料｜旧资料路径</text><text x="1140" y="293" font-size="22" style="fill:#526569">crash_crown_profile_v1</text><text x="1140" y="323" font-size="22" style="fill:#526569">生涯、旧金币、模块与天赋等长期配置</text></g><g class="architecture-node" data-x="1120" data-y="418" data-width="734" data-height="331"><rect x="1120" y="418" width="734" height="331" rx="9" class="box"/><text x="1140" y="457" font-size="30" font-weight="700">本机经济钱包｜独立资产路径</text><text x="1140" y="494" font-size="22" style="fill:#526569">cz_economy_v1</text><text x="1140" y="524" font-size="22" style="fill:#526569">整车拥有列表、车型主题皮肤、碎片</text><text x="1140" y="554" font-size="22" style="fill:#526569">芯片、奖券、通行证与抽奖记录</text><text x="1140" y="584" font-size="22" style="fill:#526569">领取／消费核对余额、权益与重复处理</text><text x="1140" y="614" font-size="22" style="fill:#526569">事务幂等及修订检查；同步以确认结果为准</text><text x="1140" y="644" font-size="22" style="fill:#526569">页面显示全目录，不会自动授予全部资产</text></g><path d="M419,287 L514,287" class="edge"/><path d="M419,488 L514,488" class="edge"/><path d="M419,684 L514,684" class="edge"/><path d="M1024,287 L1120,287" class="edge"/><path d="M1024,488 L1120,488" class="edge"/><path d="M1024,684 L1120,684" class="edge"/><rect x="42" y="822" width="1836" height="166" rx="12" class="panel"/><text x="64" y="856" font-size="23" font-weight="700" style="fill:#586c65">回到赛前：读取合法配置与使用许可</text><g class="architecture-node" data-x="65" data-y="874" data-width="959" data-height="88"><rect x="65" y="874" width="959" height="88" rx="9" class="box"/><text x="85" y="909" font-size="26" font-weight="700">构筑与出战检查</text><text x="85" y="936" font-size="22" style="fill:#526569">模块／天赋生效；模式许可、整车拥有与皮肤装备分别判断。</text></g><g class="architecture-node" data-x="1120" data-y="874" data-width="734" data-height="88"><rect x="1120" y="874" width="734" height="88" rx="9" class="box"/><text x="1140" y="909" font-size="26" font-weight="700">账号与同步边界</text><text x="1140" y="936" font-size="22" style="fill:#526569">本机存档可确认；联网实时对战与在线服务另需证据。</text></g><path d="M1487,357 L1895,357 L1895,802 L550,802 L550,874" class="edge"/><path d="M1487,749 L1487,792 L800,792 L800,874" class="edge"/></svg>