<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">执行架构：会话、事件与资产归属</title><desc id="desc">实线框为沿用的功能职责；橙色虚线框／线为拟定补齐接口，不能当成现行程序类图。</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#536b70"/></marker><marker id="proposal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a15b16"/></marker></defs><style>text{font-family:Microsoft YaHei, Noto Sans CJK SC, sans-serif;fill:#1d3035} .secondary{fill:#526569} .label{font-size:22px;font-weight:600} .edge{fill:none;stroke:#536b70;stroke-width:3;marker-end:url(#arrow)} .proposed{stroke:#a15b16;stroke-dasharray:10 7;marker-end:url(#proposal)} .box{fill:#fffefa;stroke:#728b8c;stroke-width:2} .proposal-box{fill:#fff4df;stroke:#ad6b29;stroke-width:2.3;stroke-dasharray:10 7} .row{fill:#e9eee9} .panel{fill:#f7f5eb;stroke:#c7d0c8;stroke-width:1.5}</style><rect width="1920" height="1080" fill="#f5f3e9"/><rect width="1920" height="124" fill="#18373f"/><text x="54" y="65" style="fill:#fff9e9;font-size:43px;font-weight:700">04  执行架构：会话、事件与资产归属</text><text x="56" y="104" style="fill:#d4e2dc;font-size:22px">实线框为沿用的功能职责；橙色虚线框／线为拟定补齐接口，不能当成现行程序类图。</text><path d="M55 1017H1865" stroke="#c2ccc3" stroke-width="2"/><text x="56" y="1054" font-size="21" class="secondary">03:34研究基线 8ce571…｜接口提案对应REQ-01-003、REQ-02-001／004／006／010／012｜全部验收仍以执行策划案中的测试条件为准。</text><g class="architecture-node" data-x="53" data-y="160" data-width="510" data-height="175"><rect x="53" y="160" width="510" height="175" rx="9" class="proposal-box"/><text x="73" y="199" font-size="30" font-weight="700">开赛快照｜SessionSpec</text><text x="73" y="236" font-size="22" style="fill:#526569">拟定：sessionId、地图／种子／阵容</text><text x="73" y="266" font-size="22" style="fill:#526569">ruleProfileId统一模式覆盖</text><text x="73" y="296" font-size="22" style="fill:#526569">加载以后不读取大厅新选择</text></g><g class="architecture-node" data-x="615" data-y="160" data-width="687" data-height="175"><rect x="615" y="160" width="687" height="175" rx="9" class="box"/><rect x="615" y="160" width="7" height="175" rx="2" fill="#cb6925"/><text x="635" y="199" font-size="30" font-weight="700">当前局内系统</text><text x="635" y="236" font-size="22" style="fill:#526569">驾驶 → Rapier接触 → 战斗状态 → 模式判定</text><text x="635" y="266" font-size="22" style="fill:#526569">技能、机关、AI提交请求；HUD消费结果</text><text x="635" y="296" font-size="22" style="fill:#526569">表现不写回伤害；训练与普通比赛分开</text></g><g class="architecture-node" data-x="1354" data-y="160" data-width="510" data-height="175"><rect x="1354" y="160" width="510" height="175" rx="9" class="proposal-box"/><text x="1374" y="199" font-size="30" font-weight="700">结果与资产归属</text><text x="1374" y="236" font-size="22" style="fill:#526569">拟定：固定ownerParticipantId</text><text x="1374" y="266" font-size="22" style="fill:#526569">控制车可换，奖励账号不随之漂移</text><text x="1374" y="296" font-size="22" style="fill:#526569">回合结果与整场奖励分开确认</text></g><path d="M563,245 L615,245" class="edge proposed"/><path d="M1302,245 L1354,245" class="edge proposed"/><rect x="43" y="379" width="1832" height="300" rx="12" class="panel"/><text x="65" y="413" font-size="23" font-weight="700" style="fill:#586c65">拟定会话状态机｜命名与枚举待落地，已有流程按同等条件对齐</text><g class="architecture-node" data-x="65" data-y="443" data-width="278" data-height="103"><rect x="65" y="443" width="278" height="103" rx="9" class="proposal-box"/><text x="85" y="482" font-size="25" font-weight="700">CREATED</text><text x="85" y="519" font-size="22" style="fill:#526569">建立规格</text></g><g class="architecture-node" data-x="365" data-y="443" data-width="278" data-height="103"><rect x="365" y="443" width="278" height="103" rx="9" class="proposal-box"/><text x="385" y="482" font-size="25" font-weight="700">LOADING</text><text x="385" y="519" font-size="22" style="fill:#526569">资源就绪检查</text></g><g class="architecture-node" data-x="665" data-y="443" data-width="278" data-height="103"><rect x="665" y="443" width="278" height="103" rx="9" class="proposal-box"/><text x="685" y="482" font-size="25" font-weight="700">READY</text><text x="685" y="519" font-size="22" style="fill:#526569">清输入／待开场</text></g><g class="architecture-node" data-x="965" data-y="443" data-width="278" data-height="103"><rect x="965" y="443" width="278" height="103" rx="9" class="proposal-box"/><text x="985" y="482" font-size="25" font-weight="700">RUNNING</text><text x="985" y="519" font-size="22" style="fill:#526569">局内规则运行</text></g><g class="architecture-node" data-x="1265" data-y="443" data-width="278" data-height="103"><rect x="1265" y="443" width="278" height="103" rx="9" class="proposal-box"/><text x="1285" y="482" font-size="25" font-weight="700">RESOLVING</text><text x="1285" y="519" font-size="22" style="fill:#526569">冻结并确认结果</text></g><g class="architecture-node" data-x="1565" data-y="443" data-width="278" data-height="103"><rect x="1565" y="443" width="278" height="103" rx="9" class="proposal-box"/><text x="1585" y="482" font-size="25" font-weight="700">FINISHED</text><text x="1585" y="519" font-size="22" style="fill:#526569">展示并提交结果</text></g><path d="M343,493 L365,493" class="edge proposed"/><path d="M643,493 L665,493" class="edge proposed"/><path d="M943,493 L965,493" class="edge proposed"/><path d="M1243,493 L1265,493" class="edge proposed"/><path d="M1543,493 L1565,493" class="edge proposed"/><g class="architecture-node" data-x="1265" data-y="578" data-width="278" data-height="76"><rect x="1265" y="578" width="278" height="76" rx="9" class="proposal-box"/><text x="1285" y="613" font-size="24" font-weight="700">DISPOSING</text><text x="1285" y="640" font-size="22" style="fill:#526569">关闭输入／回收</text></g><g class="architecture-node" data-x="1565" data-y="578" data-width="278" data-height="76"><rect x="1565" y="578" width="278" height="76" rx="9" class="proposal-box"/><text x="1585" y="613" font-size="24" font-weight="700">DISPOSED</text><text x="1585" y="640" font-size="22" style="fill:#526569">允许下次会话</text></g><path d="M1704,546 L1704,562 L1404,562 L1404,578" class="edge proposed"/><path d="M1543,615 L1565,615" class="edge proposed"/><text x="67" y="591" font-size="23" font-weight="600">暂停：RUNNING子状态，规则时间冻结。</text><text x="67" y="632" font-size="23">加载失败或主动返回：转失败／清理，旧异步资源不得进入新会话。</text><rect x="43" y="721" width="1832" height="259" rx="12" class="panel"/><text x="65" y="755" font-size="23" font-weight="700" style="fill:#586c65">拟定跨系统交接｜把来源、时序、重复处理和失败恢复写进同一份结果</text><g class="architecture-node" data-x="65" data-y="776" data-width="534" data-height="167"><rect x="65" y="776" width="534" height="167" rx="9" class="proposal-box"/><text x="85" y="815" font-size="29" font-weight="700">统一事件头</text><text x="85" y="852" font-size="22" style="fill:#526569">sessionId／roundId／eventId／simTick</text><text x="85" y="882" font-size="22" style="fill:#526569">source／target／ruleProfileId</text><text x="85" y="912" font-size="22" style="fill:#526569">接触、技能、淘汰分类型数据体</text></g><g class="architecture-node" data-x="650" data-y="776" data-width="586" data-height="167"><rect x="650" y="776" width="586" height="167" rx="9" class="proposal-box"/><text x="670" y="815" font-size="29" font-weight="700">确认与消费者</text><text x="670" y="852" font-size="22" style="fill:#526569">同一确认结果交给模式、任务和HUD</text><text x="670" y="882" font-size="22" style="fill:#526569">不同消费者不重复制造伤害或击杀</text><text x="670" y="912" font-size="22" style="fill:#526569">退出后拒绝旧会话事件与迟到资源</text></g><g class="architecture-node" data-x="1287" data-y="776" data-width="556" data-height="167"><rect x="1287" y="776" width="556" height="167" rx="9" class="proposal-box"/><text x="1307" y="815" font-size="29" font-weight="700">唯一结果键与持久写入</text><text x="1307" y="852" font-size="22" style="fill:#526569">整场sessionId；回合另加roundId</text><text x="1307" y="882" font-size="22" style="fill:#526569">幂等重试，不因继续／刷新多发奖励</text><text x="1307" y="912" font-size="22" style="fill:#526569">写入失败保留待处理状态与重试入口</text></g><path d="M599,858 L650,858" class="edge proposed"/><path d="M1236,858 L1287,858" class="edge proposed"/></svg>