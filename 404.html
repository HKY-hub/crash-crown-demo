<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>页面不存在 · HKY 作品集</title>
<link rel="icon" href="https://hky-hub.github.io/crash-crown-demo/assets/crown.svg" type="image/svg+xml">
<meta name="theme-color" content="#f5f7fa">
<meta name="description" content="这个地址没有对应页面。返回 HKY 的游戏策划作品集继续浏览。">
<style>
:root{--paper:#f5f7fa;--ink:#172033;--muted:#5b6b82;--line:#dfe4ec;--navy:#0c2140;--blue:#1d4ed8;--sans:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-underline-offset:3px}
a:hover{color:var(--navy)}
.top{border-bottom:1px solid var(--line);background:rgba(245,247,250,.94);backdrop-filter:blur(12px)}
.top .inner{width:min(980px,calc(100% - 48px));margin:auto;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none;font-weight:700}
.brand b{font-size:23px;letter-spacing:-.04em}
.brand b::after{content:".";color:var(--blue)}
.brand span{font:10px/1.5 var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.top nav{display:flex;gap:20px;font-size:13px}
.top nav a{color:var(--muted);text-decoration:none}
.top nav a:hover{color:var(--navy)}
.wrap{width:min(980px,calc(100% - 48px));margin:28px auto 64px}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px rgba(18,32,50,.05);padding:clamp(26px,5vw,56px)}
.eyebrow{margin:0;font:10px/1.8 var(--mono);letter-spacing:.16em;color:var(--blue);text-transform:uppercase}
h1{margin:12px 0 16px;font-size:clamp(38px,7vw,66px);line-height:1.12;letter-spacing:-.03em;color:var(--navy)}
.nw{white-space:nowrap}
.lede{max-width:60ch;margin:0;color:var(--muted);font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font:700 13px var(--sans);text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:hover{border-color:var(--navy);text-decoration:none}
.links{margin:34px 0 0;padding:22px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px}
.links a{color:var(--muted);text-decoration:none}
.links a:hover{color:var(--navy)}
.foot{color:var(--muted);font:11px/1.7 var(--mono);letter-spacing:.04em}
@media(max-width:600px){
  .top .inner,.wrap{width:calc(100% - 28px)}
  .top .inner{min-height:56px}
  .top nav{display:none}
  .wrap{margin:16px auto 36px}
  .card{padding:24px 18px 30px}
  h1{font-size:clamp(34px,12vw,46px)}
  .actions .btn{width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <a class="brand" href="https://hky-hub.github.io/crash-crown-demo/"><b>HKY</b><span>Portfolio 2026</span></a>
    <nav aria-label="快捷链接">
      <a href="https://hky-hub.github.io/crash-crown-demo/#work">作品</a>
      <a href="https://hky-hub.github.io/crash-crown-demo/docs/">文档</a>
      <a href="https://hky-hub.github.io/crash-crown-demo/release.html">版本说明</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="card" aria-labelledby="notfound-title">
    <p class="eyebrow">404 / Not Found</p>
    <h1 id="notfound-title">这个地址没有<span class="nw">页面</span>。</h1>
    <p class="lede">链接可能已经更新，或地址拼写有误。回到作品集，或从下面的入口继续浏览项目与文档。</p>
    <div class="actions">
      <a class="btn primary" href="https://hky-hub.github.io/crash-crown-demo/">← 返回作品集</a>
      <a class="btn" href="https://hky-hub.github.io/crash-crown-demo/#work">查看作品</a>
      <a class="btn" href="https://hky-hub.github.io/crash-crown-demo/docs/">文档与表格</a>
    </div>
    <nav class="links" aria-label="项目快捷入口">
      <a href="https://hky-hub.github.io/crash-crown-demo/iaa/">三款箭头 IAA 拆解</a>
      <a href="https://hky-hub.github.io/crash-crown-demo/iaa/water-match/">Water Match IAA 拆解</a>
      <a href="https://hky-hub.github.io/crash-crown-demo/cs2/">CS2 系统拆解</a>
      <a href="https://hky-hub.github.io/crash-crown-demo/game/client.html">撞击王座客户端</a>
    </nav>
    <p class="foot">原创内容 © 2026 HKY · 第三方素材保留各自权利及来源</p>
  </section>
</main>
</body>
</html>
