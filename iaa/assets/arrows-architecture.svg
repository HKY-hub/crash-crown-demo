<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 375" role="img"><title>箭头解谜 / 同一盘面里的多种选择</title><rect width="100%" height="100%" fill="#faf9f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#a14c2c"/></marker></defs><text x="42" y="42" font-size="25" font-weight="600" fill="#22333e" font-family="Microsoft YaHei">箭头解谜 / 同一盘面里的多种选择</text><text x="42" y="69" font-size="15" fill="#59636a" font-family="Microsoft YaHei">任务、规则与反馈之间的关系。</text><path d="M312,140H344" fill="none" stroke="#a14c2c" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M622,140H654" fill="none" stroke="#a14c2c" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M177,230V193" fill="none" stroke="#a14c2c" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M797,185V203.5H487V222" fill="none" stroke="#a14c2c" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M352,275H320" fill="none" stroke="#a14c2c" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M177,185V203.5H797V222" fill="none" stroke="#a14c2c" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><rect x="42" y="95" width="270" height="90" rx="7" fill="white" stroke="#a14c2c" stroke-width="1.4"/><text x="57" y="127" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">棋盘与扫掠</text><text x="57" y="152" font-family="Microsoft YaHei" font-size="15" fill="#52616b">形状、方向、剩余对象</text><rect x="352" y="95" width="270" height="90" rx="7" fill="white" stroke="#a14c2c" stroke-width="1.4"/><text x="367" y="127" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">输入与错误</text><text x="367" y="152" font-family="Microsoft YaHei" font-size="15" fill="#52616b">命中对象、手势</text><text x="367" y="172" font-family="Microsoft YaHei" font-size="15" fill="#52616b">一次错误预算</text><rect x="662" y="95" width="270" height="90" rx="7" fill="white" stroke="#a14c2c" stroke-width="1.4"/><text x="677" y="127" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">耗尽与恢复</text><text x="677" y="152" font-family="Microsoft YaHei" font-size="15" fill="#52616b">续心、补星、重开</text><rect x="42" y="230" width="270" height="90" rx="7" fill="white" stroke="#a14c2c" stroke-width="1.4"/><text x="57" y="262" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">信息与道具</text><text x="57" y="287" font-family="Microsoft YaHei" font-size="15" fill="#52616b">提示、尺子、盘面干预</text><rect x="352" y="230" width="270" height="90" rx="7" fill="white" stroke="#a14c2c" stroke-width="1.4"/><text x="367" y="262" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">主动交换</text><text x="367" y="287" font-family="Microsoft YaHei" font-size="15" fill="#52616b">广告时间、金币或内购</text><rect x="662" y="230" width="270" height="90" rx="7" fill="white" stroke="#a14c2c" stroke-width="1.4"/><text x="677" y="262" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">局外目标</text><text x="677" y="287" font-family="Microsoft YaHei" font-size="15" fill="#52616b">联赛、Zone、每日挑战</text></svg>