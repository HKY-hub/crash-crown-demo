<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../assets/crown.svg" />
    <meta name="theme-color" content="#18181b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="教学视频语音文本提取系统前端演示：模拟上传、转写、编辑、历史与导出，不连接后端。" />
    <title>教学视频语音文本提取系统 · 前端演示</title>
    <script type="module" crossorigin src="./assets/index-Ctrbv9Wa.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BVLJDtIB.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var KEY = "demo_notice_seen";
        var handled = false;
        function handle() {
          if (handled) return;
          var heading = Array.prototype.find.call(document.querySelectorAll("h3"), function (el) {
            return el.textContent.trim() === "注意事项";
          });
          var header = heading && heading.closest(".notice-header");
          var close = header && header.querySelector("button.close-btn");
          if (!close) return;
          handled = true;
          observer.disconnect();
          if (localStorage.getItem(KEY) === "1") {
            close.click();
            return;
          }
          close.addEventListener("click", function () {
            try { localStorage.setItem(KEY, "1"); } catch (e) {}
          }, { once: true });
        }
        var observer = new MutationObserver(handle);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        handle();
        setTimeout(handle, 1500);
      })();
    </script>
  </body>
</html>
