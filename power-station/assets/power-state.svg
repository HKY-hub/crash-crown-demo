<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 375" role="img"><title>任务推进 / 物资与门闩均完成才允许改供</title><rect width="100%" height="100%" fill="#faf9f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#26685a"/></marker></defs><text x="42" y="42" font-size="25" font-weight="600" fill="#22333e" font-family="Microsoft YaHei">任务推进 / 物资与门闩均完成才允许改供</text><text x="42" y="69" font-size="15" fill="#59636a" font-family="Microsoft YaHei">任务、规则与反馈之间的关系。</text><path d="M312,140H344" fill="none" stroke="#26685a" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M622,140H654" fill="none" stroke="#26685a" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M797,185V203.5H177V222" fill="none" stroke="#26685a" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M797,185V203.5H487V222" fill="none" stroke="#26685a" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M312,275H654" fill="none" stroke="#26685a" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><path d="M622,275H654" fill="none" stroke="#26685a" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/><rect x="42" y="95" width="270" height="90" rx="7" fill="white" stroke="#26685a" stroke-width="1.4"/><text x="57" y="127" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">取得维修件</text><text x="57" y="152" font-family="Microsoft YaHei" font-size="15" fill="#52616b">I01 </text><text x="57" y="172" font-family="Microsoft YaHei" font-size="15" fill="#52616b"> 西北维修间</text><rect x="352" y="95" width="270" height="90" rx="7" fill="white" stroke="#26685a" stroke-width="1.4"/><text x="367" y="127" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">设备修复</text><text x="367" y="152" font-family="Microsoft YaHei" font-size="15" fill="#52616b">I02 </text><text x="367" y="172" font-family="Microsoft YaHei" font-size="15" fill="#52616b"> 自动给仓库供电</text><rect x="662" y="95" width="270" height="90" rx="7" fill="white" stroke="#26685a" stroke-width="1.4"/><text x="677" y="127" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">进入仓库</text><text x="677" y="152" font-family="Microsoft YaHei" font-size="15" fill="#52616b">北侧受电入口</text><rect x="42" y="230" width="270" height="90" rx="7" fill="white" stroke="#26685a" stroke-width="1.4"/><text x="57" y="262" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">取医疗物资</text><text x="57" y="287" font-family="Microsoft YaHei" font-size="15" fill="#52616b">I03 </text><text x="57" y="307" font-family="Microsoft YaHei" font-size="15" fill="#52616b"> 与开门可交换</text><rect x="352" y="230" width="270" height="90" rx="7" fill="white" stroke="#26685a" stroke-width="1.4"/><text x="367" y="262" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">内开机械门闩</text><text x="367" y="287" font-family="Microsoft YaHei" font-size="15" fill="#52616b">I04 </text><text x="367" y="307" font-family="Microsoft YaHei" font-size="15" fill="#52616b"> 首次内开、之后保留</text><rect x="662" y="230" width="270" height="90" rx="7" fill="white" stroke="#26685a" stroke-width="1.4"/><text x="677" y="262" font-family="Microsoft YaHei" font-size="21" font-weight="600" fill="#22333e">改供并离站</text><text x="677" y="287" font-family="Microsoft YaHei" font-size="15" fill="#52616b">回 I02 切出口</text><text x="677" y="307" font-family="Microsoft YaHei" font-size="15" fill="#52616b">进入离站触发区</text></svg>